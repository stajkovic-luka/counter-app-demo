apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: counter-app
  template:
    metadata:
      labels:
        app: counter-app
    spec:
      containers:
        - name: counter-app
          image: ghcr.io/stajkovic-luka/counter-app:c63adccf57b921fc3b386ee711406b8f11b7065c
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: counter-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: counter-app
spec:
  type: NodePort
  selector:
    app: counter-app
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
