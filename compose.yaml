services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: counter-app:latest
        environment:
            - REDIS_HOST=redis
            - REDIS_PORT=${REDIS_PORT:-6379}
        ports:
            - "${APP_PORT:-8080}:8080"
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - counter-app-network
    redis:
        image: redis:7.0.1-alpine
        restart: unless-stopped
        volumes:
            - counter-redis_data:/data
        networks:
            - counter-app-network
        healthcheck:
            test: ["CMD","redis-cli","ping"]
            interval: 5s
            timeout: 3s
            retries: 5
networks:
    counter-app-network:
        driver: bridge

volumes:
    counter-redis_data:
